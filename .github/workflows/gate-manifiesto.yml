name: gate-manifiesto
on:
  pull_request:
    branches: [ "main" ]
jobs:
  manifiesto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m herramientas.validar_manifiesto
      - run: |
          for codigo in agentes/*/agente.py; do
            grep -q "ruta: $codigo" manifiestos/*.yaml || { echo "falta el manifiesto de $codigo"; exit 1; }
          done
