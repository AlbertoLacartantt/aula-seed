name: ci
on:                                          #Cuando se ejecuta ( PR en el main )
 pull_request:
   branches: [ "main" ]
jobs:                                        # Distintos trabajos
 tests:
   runs-on: ubuntu-latest                    # Maquina con la que se ejecuta
   steps:
     - uses: actions/checkout@v7             # Instalar codigo
     - uses: actions/setup-python@v7         # Instalar python
       with:
         python-version: "3.11"
     - run: python -m pip install -r requirements.txt   # Instala dependencias
     - run: python -m pytest tests/ -q --cov=src/aula/dominio --cov-report=term-missing --cov-fail-under=60   # Ejecuta test y exige cobertura del dominio >= 60%
 tamano-pr:
   runs-on: ubuntu-latest
   env:
     LIMITE_LINEAS: 400
     ADICIONES: ${{ github.event.pull_request.additions }}
     BORRADOS: ${{ github.event.pull_request.deletions }}
   steps:
     - run: |
         TOTAL=$((ADICIONES + BORRADOS))
         if [ "$TOTAL" -gt "$LIMITE_LINEAS" ]; then
           exit 1
         fi
 imagen:
   runs-on: ubuntu-latest
   needs: tests                             
   permissions:
     contents: read
     packages: write
   steps:
     - uses: actions/checkout@v7
     - run: docker build -f Containerfile -t ghcr.io/albertolacartantt/aula-seed:${{ github.sha }} .
     - env:
         TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
     - run: docker push ghcr.io/albertolacartantt/aula-seed:${{ github.sha }}

