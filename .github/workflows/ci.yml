name: ci
on:                                          #Cuando se ejecuta ( PR en el main )
 pull_request:
   branches: [ "main" ]
jobs:                                        # Distintos trabajos
 tests:
   runs-on: ubuntu-latest                    # Maquina con la que se ejecuta
   steps:
     - uses: actions/checkout@v7             # Instalar codigo
     - uses: actions/setup-python@v7         # Instalar python
       with:
         python-version: "3.11"
     - run: python -m pip install -r requirements.txt   # Instala dependencias
     - run: python -m pytest tests/ -q --cov=src/aula/dominio --cov-report=term-missing --cov-fail-under=60   # Ejecuta test y exige cobertura del dominio >= 60%
     - run: |                                # Falla si algun criterio de una spec activa no tiene test con cubre:
         python - <<'EOF'
         import sys
         from agentes.mcp_aula.servidor import listar_specs, trazabilidad
         fallos = 0
         for spec in listar_specs()["specs"]:
             if spec["estado"] != "activa":
                 continue
             t = trazabilidad({"spec_id": spec["id"]})
             print(t["spec"], t["cobertura_pct"], "% sin cubrir:", t["sin_cubrir"])
             if t["sin_cubrir"]:
                 fallos += 1
         sys.exit(fallos)
         EOF
 tamano-pr:
   runs-on: ubuntu-latest
   env:
     LIMITE_LINEAS: 400
     ADICIONES: ${{ github.event.pull_request.additions }}
     BORRADOS: ${{ github.event.pull_request.deletions }}
   steps:
     - run: |
         TOTAL=$((ADICIONES + BORRADOS))
         if [ "$TOTAL" -gt "$LIMITE_LINEAS" ]; then
           exit 1
         fi
 imagen:
   runs-on: ubuntu-latest
   needs: tests                             
   permissions:
     contents: read
     packages: write
   steps:
     - uses: actions/checkout@v7
     - run: docker build -f Containerfile -t ghcr.io/albertolacartantt/aula-seed:${{ github.sha }} .
     - env:
         TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
     - run: docker push ghcr.io/albertolacartantt/aula-seed:${{ github.sha }}
 conformidad:
   runs-on: ubuntu-latest
   permissions:
     contents: read
     pull-requests: write
   steps:
     - uses: actions/checkout@v7
       with:
         fetch-depth: 0
     - uses: actions/setup-python@v7
       with:
         python-version: "3.11"
     - env:
         CUERPO: ${{ github.event.pull_request.body }}
       run: printf '%s\n' "$CUERPO" | tr -d '\r' > cuerpo.md
     - run: python -m herramientas.conformidad_pr --base origin/main --cuerpo cuerpo.md > veredicto.txt || true
     - env:
         GH_TOKEN: ${{ github.token }}
       run: |
         { echo '### Veredicto del agente de conformidad'; echo '```json'; cat veredicto.txt; echo '```'; } > comentario.md
         gh pr comment ${{ github.event.pull_request.number }} --body-file comentario.md


